<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>rea-games · FLAPPY 复刻 v1.0</title>
<style>html,body{margin:0;padding:0;background:#000;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}#game{image-rendering:pixelated}</style></head>
<body><div id="game"></div>
<script src="./phaser.min.js"></script>
<script>
// ============ Flappy 机制复刻 · 帧帧对上标准 ============
// 原版机制参数：重力 ~1400px/s²、点按冲量 -380、管速 -150px/s、管间隙 150px、管距 220px、Bird 24x24、碰地/碰管/碰顶即死、过管+1
const W=360,H=576,GRAVITY=1400,FLAP=-380,PIPE_SPEED=-150,GAP=150,PIPE_W=56,PIPE_SPACING=220,BIRD=24;
let scene,bird,pipes,pipeTimer,score=0,scoreText,msgText,started=false,dead=false,groundY;

function create(){
  scene=this;
  groundY=H-56;
  // 地面
  const g=scene.add.graphics(); g.fillStyle(0x8a6d3b,1); g.fillRect(0,groundY,W,H-groundY);
  g.fillStyle(0x6b5430,1); g.fillRect(0,groundY,W,6);
  // 鸟（原创像素鸟：Graphics绘制）
  const bg=scene.add.graphics();
  bg.fillStyle(0xffd700,1); bg.fillRect(0,0,BIRD,BIRD);           // 身体
  bg.fillStyle(0xffffff,1); bg.fillRect(15,5,6,6);               // 眼白
  bg.fillStyle(0x000000,1); bg.fillRect(18,7,3,3);               // 瞳
  bg.fillStyle(0xff8c00,1); bg.fillRect(BIRD-4,10,6,5);          // 嘴
  bg.fillStyle(0xffb347,1); bg.fillRect(0,10,10,8);              // 翅膀
  bird=scene.physics.add.existing(bg);
  bird.body.setCollideWorldBounds(false);
  bird.body.enable=false;
  bird.body.setSize(BIRD,BIRD);
  pipes=scene.physics.add.staticGroup();
  scoreText=scene.add.text(W/2,30,'0',{fontFamily:'monospace',fontSize:'44px',fontStyle:'bold',color:'#fff'}).setOrigin(0.5);
  msgText=scene.add.text(W/2,H/2-60,'按 空格 或 点击 起飞\n点按拍翅 · 穿管得分',{fontFamily:'monospace',fontSize:'18px',color:'#fff',align:'center'}).setOrigin(0.5);

  scene.input.on('pointerdown',flap);
  scene.input.keyboard.on('keydown-SPACE',flap);
}
function flap(){
  if(dead){ return; }
  if(!started){ startGame(); }
  bird.body.velocity.y=FLAP;
  // 帧帧对上手感：点按瞬间速度重置（原版手感=速度不叠加）
}
function startGame(){
  started=true; dead=false; score=0; scoreText.setText('0'); msgText.setVisible(false);
  bird.x=W*0.32; bird.y=H*0.45;
  bird.body.enable=true; bird.body.velocity.set(0,0);
  if(pipeTimer)pipeTimer.remove();
  pipeTimer=scene.time.addEvent({delay:PIPE_SPACING/(-PIPE_SPEED)*1000,loop:true,callback:spawnPipe});
  spawnPipe();
}
function spawnPipe(){
  const gapY=Phaser.Math.Between(90,groundY-GAP-90);
  // 上管
  const topH=gapY-GAP/2;
  const tg=scene.add.graphics();
  tg.fillStyle(0x2ecc40,1); tg.fillRect(0,0,PIPE_W,topH);
  tg.fillStyle(0x1a8f2a,1); tg.fillRect(0,topH-14,PIPE_W,14); // 管口加粗
  const tp=scene.physics.add.existing(tg,true);
  tp.body.setSize(PIPE_W,topH);
  tg.x=W; tg.y=0;
  // 下管
  const botY=gapY+GAP/2;
  const botH=groundY-botY;
  const bg2=scene.add.graphics();
  bg2.fillStyle(0x2ecc40,1); bg2.fillRect(0,0,PIPE_W,botH);
  bg2.fillStyle(0x1a8f2a,1); bg2.fillRect(0,0,PIPE_W,14);
  const bp=scene.physics.add.existing(bg2,true);
  bp.body.setSize(PIPE_W,botH);
  bg2.x=W; bg2.y=botY;
  // 入组+速度
  pipes.add(tg); pipes.add(bg2);
  tg.body.velocity.x=PIPE_SPEED; tg.body.immovable=true; tg.body.moves=true;
  bg2.body.velocity.x=PIPE_SPEED; bg2.body.immovable=true; bg2.body.moves=true;
}
function update(){
  if(!scene||!started||dead)return;
  // 管移动+越界清理+计分
  pipes.children.iterate(p=>{
    if(!p||!p.body)return;
    p.body.velocity.x=PIPE_SPEED;
    if(p.x+PIPE_W<0){ p.destroy(); return; }
    // 过管计分（管中心过鸟）
    if(!p.scored && p.x+PIPE_W/2 < bird.x){
      p.scored=true; score++; scoreText.setText(String(score));
    }
  });
  // 碰撞检测（矩形相交）
  const bb=bird.body;
  if(bb.y+bb.height>=groundY){ die(); return; }
  if(bb.y<-40){ die(); return; } // 飞出顶部（原版允许略越顶但不计）
  pipes.children.iterate(p=>{
    if(!p||!p.body||!p.visible)return;
    const pb=p.body;
    if(bb.x<pb.x+PIPE_W && bb.x+bb.width>pb.x && bb.y<pb.y+pb.height && bb.y+bb.height>pb.y) die();
  });
  // 鸟倾角（原版手感：速度映射角度）
  bird.rotation=Phaser.Math.Clamp(bird.body.velocity.y/600,-0.5,1.2);
}
function die(){
  dead=true;
  bird.body.enable=false;
  if(pipeTimer)pipeTimer.remove();
  msgText.setText('💀 得分 '+score+(score>=20?' · 🏆 高手!':score>=10?' · 不错':'')+'\n按 空格 或 点击 重来').setVisible(true);
  scene.time.delayedCall(300,()=>{ started=false; });
  // 重开由 flap() 里的 started=false 分支处理
}
const config={type:Phaser.AUTO,width:W,height:H,parent:'game',pixelArt:true,roundPixels:true,backgroundColor:'#4ec0ca',
physics:{default:'arcade',arcade:{gravity:{y:GRAVITY},fixedStep:true,fps:60}},
scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
scene:{create:create,update:update}};

// 测试/演示钩子：?auto=1 自动开始（WB审核&自动化测试用）
if (location.search.includes('auto=1')) {
  setTimeout(()=>{ try{
    if (typeof startGame==='function') startGame();
    else if (typeof start==='function') start();
    else if (typeof launch==='function') launch();
  }catch(e){ console.warn('auto-start', e); } }, 2500);
}
new Phaser.Game(config);
</script></body></html>
